name: policy-sarif

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: policy-sarif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: bifrost code-smells scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # The pinned release predates the workspace-scaled policy budgets
      # (#1773), which the self-scan needs to conclude. Build the current
      # tree instead: the dogfood then also gates the code it ships with.
      - name: Build bifrost
        run: |
          cargo build --release --bin bifrost
          echo "${GITHUB_WORKSPACE}/target/release" >> "${GITHUB_PATH}"

      - name: Scan with the built-in pack
        uses: ./.github/actions/policy-scan
        with:
          version: local
          category: bifrost-code-smells
